services:
  postgres:
    image: postgres:16-alpine
    container_name: invoicepro-db

    environment:
      POSTGRES_DB: invoicepro
      POSTGRES_USER: invoicepro_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicepro_user -d invoicepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: invoicepro-api

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=invoicepro;Username=invoicepro_user;Password=${DB_PASSWORD}"
      JWT__Secret: "${JWT_SECRET}"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: